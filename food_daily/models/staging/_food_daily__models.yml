version: 2

models:
  - name: stg_food_daily__order
    description: "Staged food delivery orders: renamed, cleaned, and type-cast columns from the raw food_daily source."
    columns:
      - name: customer_id
        description: "Customer identifier, trimmed."
        data_tests:
          - not_null
      - name: order_id
        description: "Order identifier, generated as a hash of customer_id, order_date, order_time, and amount to guarantee uniqueness."
        data_tests:
          - not_null
          - unique
      - name: order_date
        description: "Date the order was placed."
        data_tests:
          - not_null
      - name: order_time
        description: "Time the order was placed."
        data_tests:
          - not_null
      - name: items
        description: "Ordered items, lowercased and split from the raw colon-delimited list."
      - name: restaurant
        description: "Restaurant name, trimmed. Source column 'restaurnt' is misspelled."
        data_tests:
          - not_null
      - name: amount
        description: "Order amount, passed through unchanged from the raw source."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: mode
        description: "Payment mode used for the order."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Wallet", "Card", "Online", "Cash"]
      - name: order_status
        description: "Status of the order, normalized to a fixed set of values."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Delivered", "Not delivered", "On Hold", "Cancelled"]
      - name: ratings
        description: "Customer rating, nullable, clamped to the 1-5 range."
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
              config:
                where: "ratings is not null"
      - name: feedback
        description: "Customer feedback text, trimmed."
