version: 2

models:
  - name: int_feedback_category
    description: "Order enriched with feedback category classification"
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Merchant (Food Quality)", "Platform(Logistics)", "Platform(App & System)", "Pricing", "Unclassified"]