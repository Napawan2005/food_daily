x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: food_daily/airflow:3.3.0
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow_postgres/${AIRFLOW_DB_USER}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__AUTH_MANAGER: 'airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager'

    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: '${AIRFLOW_ADMIN_USER}:admin'

    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow_webserver:8080/execution/'
    MINIO_ENDPOINT: ${MINIO_ENDPOINT}
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    CLICKHOUSE_HOST: clickhouse_db
    CLICKHOUSE_PORT: 8123
    CLICKHOUSE_USER: ${CLICKHOUSE_USER}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    CLICKHOUSE_DB: ${CLICKHOUSE_DB}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dataset:/opt/airflow/dataset
    - ./food_daily:/opt/airflow/dbt
    - airflow_logs:/opt/airflow/logs
    - ./airflow_config/simple_auth_manager_passwords.json.generated:/opt/airflow/simple_auth_manager_passwords.json.generated
  depends_on:
    airflow_postgres:
      condition: service_healthy

services:
  clickhouse_db:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    restart: always
    ports:
      - "8123:8123" 
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}       
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}   
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD} 
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=3 
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ch_data:/var/lib/clickhouse
      - ch_logs:/var/log/clickhouse-server

  miniO:
    image: minio/minio
    container_name: minio-food
    ports:
      - 9001:9000
      - 9002:9001
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}

    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  minio_bootstrap:
    image: minio/mc
    container_name: minio-bootstrap
    depends_on:
      - miniO
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://miniO:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD) do echo 'waiting for minio...' && sleep 2; done;
      /usr/bin/mc mb -p local/raw-food-daily;
      /usr/bin/mc mb -p local/parquet-food-daily;
      exit 0;
      "

  airflow_postgres:
    image: postgres:18
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_USER}
    volumes:
      - airflow_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER}"]
      interval: 5s
      retries: 5

  airflow_init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
    restart: on-failure

  airflow_webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      airflow_postgres:
        condition: service_healthy
      airflow_init:
        condition: service_completed_successfully
    restart: always

  airflow_dag_processor:
      <<: *airflow-common
      container_name: airflow-dag-processor
      command: dag-processor
      depends_on:
        airflow_postgres: { condition: service_healthy }
        airflow_init:     { condition: service_completed_successfully }
      restart: always

  airflow_scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow_postgres:
        condition: service_healthy
      airflow_init:
        condition: service_completed_successfully
    restart: always

  airflow_triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    depends_on:
      airflow_postgres:
        condition: service_healthy
      airflow_init:
        condition: service_completed_successfully
    restart: always

  dbt:
    image: python:3.13-slim
    container_name: dbt
    working_dir: /dbt
    volumes:
      - ./dbt/food_daily:/dbt
    environment:
      - CLICKHOUSE_HOST=clickhouse_db
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}
    command: ["sh", "-c", "pip install uv && uv pip install --system dbt-clickhouse && dbt run"]
    depends_on:
      clickhouse_db:
        condition: service_healthy

volumes:
  ch_data:
  ch_logs:
  minio_data:
  airflow_pg_data:
  airflow_logs:
